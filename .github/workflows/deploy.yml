# Live deploy to Firebase Hosting. Runs ONLY when the owner pushes a version tag (v*),
# and only if that tag points at a commit already on main. Branches never deploy.
# Firestore rules are not deployed from here.
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

env:
  FIREBASE_TOOLS_VERSION: 15.35.0

jobs:
  deploy:
    name: Verify, build and deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Not deploying."; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --global firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          # The Firebase web config is public by design; it lives in repository variables.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_USE_EMULATORS: 'false'
      - run: npm run size

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROOTCAMP_AC019 }}
          projectId: rootcamp-ac019
          channelId: live
          firebaseToolsVersion: ${{ env.FIREBASE_TOOLS_VERSION }}
